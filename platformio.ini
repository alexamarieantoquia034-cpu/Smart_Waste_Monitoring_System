; PlatformIO project for the ESP32-CAM firmware.
;
; Why this file lives at the repository root: the PlatformIO VS Code extension
; only auto-detects a project when platformio.ini sits in the opened folder.
; Keeping it here means you can open the Laravel project in VS Code and press
; Build/Upload directly, with no Arduino IDE involved. All firmware sources
; still live under esp32cam/, so nothing is mixed into the Laravel app.
;
; Workflow after installing the "PlatformIO IDE" extension:
;   1. Open this folder in VS Code.
;   2. Copy esp32cam/include/secrets.example.h -> esp32cam/include/secrets.h
;      and fill in your Wi-Fi details and the device API key.
;   3. Click the >| (Upload) button in the PlatformIO status bar, or press
;      Ctrl+Shift+B to build, Ctrl+Shift+U to upload, Ctrl+Shift+M for the
;      serial monitor.

[platformio]
default_envs   = esp32cam-ai-thinker
src_dir        = esp32cam/src
include_dir    = esp32cam/include
lib_dir        = esp32cam/lib
test_dir       = esp32cam/test
data_dir       = esp32cam/data
build_dir      = esp32cam/.pio/build
libdeps_dir    = esp32cam/.pio/libdeps

[env]
platform                  = espressif32
framework                 = arduino
monitor_speed             = 115200
monitor_filters           = esp32_exception_decoder, time
upload_speed              = 921600
; Silence the core's banner so the boot log stays readable.
build_flags               = -D CORE_DEBUG_LEVEL=1

; ---------------------------------------------------------------------------
; AI-Thinker ESP32-CAM  (the common white PCB with the OV2640)
; ---------------------------------------------------------------------------
; Built-in PSRAM is required. Before the first upload move the jumper on the
; board from 3V3 to 5V: the OV2640 browns out below about 4.5V.
[env:esp32cam-ai-thinker]
board        = esp32cam
build_flags  =
    ${env.build_flags}
    -D BOARD_AI_THINKER=1
