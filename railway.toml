# ============================================================================
# Railway deployment configuration - Smart Waste Monitoring System
# Docs: https://docs.railway.com/reference/config-as-code
#
# Steps (already completed):
#   1. Railway project created: smart-waste-monitoring
#   2. PostgreSQL plugin added  -> provides DATABASE_URL
#   3. Variables set: APP_KEY, DB_CONNECTION=pgsql, DB_URL=${DATABASE_URL}
#   4. Service source = GitHub repo (alexamarieantoquia034-cpu/
#      Smart_Waste_Monitoring_System), branch main -> GitHub autodeploys
#
# NOTE: Config as Code (railway.toml) is deprecated in favour of
#       Infrastructure as Code (.railway/railway.ts), but remains supported
#       until 2026-12-01.
# ============================================================================

[build]
builder = "NIXPACKS"
# Vite 7 requires Node.js >= 20.19 or >= 22.12
buildCommand = "composer install --no-dev --optimize-autoloader && php artisan package:discover --ansi && npm install && npm run build"

[deploy]
# --no-reload is required for PHP_CLI_SERVER_WORKERS below to take effect:
# without it Laravel's serve command ignores the worker count and falls back
# to a single thread. The MJPEG stream relay and the /api/live-stream SSE feed
# are long-lived requests, and with one worker an open dashboard would block
# every other request, including the ESP32-CAM's telemetry POSTs.
startCommand = "php artisan migrate --force --seed && php artisan serve --no-reload --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Pin the Node.js version used during the frontend build (Vite 7 needs >= 22.12)
# and give the built-in server enough workers to hold concurrent long-lived
# stream connections.
[variables]
NIXPACKS_NODE_VERSION = "22"
PHP_CLI_SERVER_WORKERS = "8"