# ============================================================================
# Railway deployment configuration - Smart Waste Monitoring System
# ============================================================================
# Docs: https://docs.railway.com/reference/config-as-code
#
# Steps:
#   1. Create a new Railway project and add a PostgreSQL plugin.
#   2. Generate an app key locally:
#        php artisan key:generate --show
#   3. Set these variables in the Variables tab:
#        APP_KEY        = <the key generated in step 2>
#        DB_CONNECTION  = pgsql
#        DB_URL         = ${DATABASE_URL}
#   4. Deploy this repository. The startCommand below automatically runs
#      the migrations (creating all tables) before starting the web server.
# ============================================================================

[build]
builder = "NIXPACKS"
buildCommand = "composer install --no-dev --optimize-autoloader && php artisan package:discover --ansi && npm install && npm run build"

[deploy]
startCommand = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10